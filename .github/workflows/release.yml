name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.18.1; empty uses current ref/tag)'
        required: false
        default: ''
      draft:
        description: 'Create release as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip running tests before building'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pre-release Tests
    runs-on: macos-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@f092c064826410a38929a5791d2c0225b94432fe # nextest

      - name: Run unit tests
        run: |
          cargo nextest run --locked -E 'not test(shapecache::test::ligatures_jetbrains)'
          cargo nextest run --locked -p wezterm-escape-parser

      - name: Guard checks
        run: |
          ./scripts/check_toolchain_pins.sh
          ./scripts/check_logs.sh
          ./scripts/check_prompts.sh

  build:
    name: Build ${{ matrix.arch }}
    runs-on: macos-latest
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_arch: universal
          - arch: arm64
            rust_targets: aarch64-apple-darwin
            build_arch: arm64
          - arch: x64
            rust_targets: x86_64-apple-darwin
            build_arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Separate cache per arch to avoid target dir contention
          key: ${{ matrix.arch }}-cargo

      - name: Optional macOS Code Signing Setup
        if: ${{ env.MACOS_CERTIFICATE != '' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Build ${{ matrix.arch }} Bundle & DMG
        env:
          PROFILE: release-opt
          BUILD_ARCH: ${{ matrix.build_arch }}
          OUT_DIR: dist
        run: |
          set -o pipefail
          ./scripts/build.sh 2>&1 | sed '/has no symbols/d'
          echo "=== Built ${{ matrix.arch }} ==="
          ls -lh dist/*.dmg dist/*.zip 2>/dev/null || true
          # Per-arch lipo verification
          if [ "${{ matrix.arch }}" = "universal" ]; then
            # Universal should be fat
            lipo -info dist/Kaku.app/Contents/MacOS/kaku-gui 2>/dev/null | grep -q "x86_64.*arm64\|arm64.*x86_64" || lipo -info dist/Kaku.app/Contents/MacOS/kaku-gui || true
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            lipo -info dist/Kaku.app/Contents/MacOS/kaku-gui 2>/dev/null | grep -q "arm64" || true
          else
            lipo -info dist/Kaku.app/Contents/MacOS/kaku-gui 2>/dev/null | grep -q "x86_64" || true
          fi

      - name: Generate Checksums (${{ matrix.arch }})
        run: |
          cd dist
          # Generate sha for whatever was built (universal or per-arch)
          for f in Kaku*.dmg kaku*.zip; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256" || true
          done
          cat *.sha256 2>/dev/null || true
          ls -lh

      - name: Upload artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            CARGO_VERSION=$(grep '^version =' kaku/Cargo.toml | head -n1 | cut -d'"' -f2)
            TAG="v${CARGO_VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 > sha256sums.txt 2>/dev/null || true
          echo "=== All checksums ==="
          cat sha256sums.txt
          echo ""
          echo "=== All artifacts ==="
          ls -lh
          # Ensure required files exist (at least universal)
          test -f Kaku.dmg || (echo "Missing Kaku.dmg" && ls -lh && exit 1)
          test -f Kaku-arm64.dmg || echo "Warning: Kaku-arm64.dmg missing"
          test -f Kaku-x64.dmg || echo "Warning: Kaku-x64.dmg missing"

      - name: Prepare Release Notes
        id: notes
        run: |
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          TAG="${{ steps.vars.outputs.tag }}"
          CLEAN_VER="${TAG#[vV]}"

          # Check if .github/RELEASE_NOTES.md matches current release
          if [ -f .github/RELEASE_NOTES.md ] && grep -qiE "^# [vV]?${CLEAN_VER}" .github/RELEASE_NOTES.md; then
            echo "Using .github/RELEASE_NOTES.md"
            cp .github/RELEASE_NOTES.md "$NOTES_FILE"
          else
            echo "Generating release notes from commits"
            cat > "$NOTES_FILE" << 'EOF'
          <div align="center">
            <img src="https://raw.githubusercontent.com/tw93/Kaku/main/assets/logo.png" alt="Kaku Logo" width="120" height="120" />
            <h1 style="margin: 12px 0 6px;">Kaku ${{ steps.vars.outputs.tag }}</h1>
            <p><em>A fast, out-of-the-box terminal built for AI coding.</em></p>
          </div>

          ### Downloads

          | File | Description | Checksum |
          |---|---|---|
          | `Kaku.dmg` | macOS Universal App Disk Image (Apple Silicon & Intel) | `Kaku.dmg.sha256` |
          | `Kaku-arm64.dmg` | macOS Apple Silicon Disk Image | `Kaku-arm64.dmg.sha256` |
          | `Kaku-x64.dmg` | macOS Intel Disk Image | `Kaku-x64.dmg.sha256` |
          | `kaku_for_update.zip` | In-app Auto Update Archive (Universal) | `kaku_for_update.zip.sha256` |
          | `kaku_for_update-arm64.zip` | In-app Auto Update Archive (ARM64) | `kaku_for_update-arm64.zip.sha256` |
          | `kaku_for_update-x64.zip` | In-app Auto Update Archive (x64) | `kaku_for_update-x64.zip.sha256` |

          ### Changelog
          EOF
            # Find previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:"* %s (%h)" "$PREV_TAG..HEAD" >> "$NOTES_FILE"
            else
              git log --no-merges --pretty=format:"* %s (%h)" -n 20 >> "$NOTES_FILE"
            fi
            echo -e "\n\n> https://github.com/${{ github.repository }}" >> "$NOTES_FILE"
          fi
          echo "notes_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Kaku ${{ steps.vars.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            dist/Kaku.dmg
            dist/Kaku-arm64.dmg
            dist/Kaku-x64.dmg
            dist/kaku_for_update.zip
            dist/kaku_for_update-arm64.zip
            dist/kaku_for_update-x64.zip
            dist/Kaku.dmg.sha256
            dist/Kaku-arm64.dmg.sha256
            dist/Kaku-x64.dmg.sha256
            dist/kaku_for_update.zip.sha256
            dist/kaku_for_update-arm64.zip.sha256
            dist/kaku_for_update-x64.zip.sha256
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
