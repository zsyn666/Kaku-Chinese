name: Sync Upstream

# Daily auto-merge from tw93/Kaku (upstream) into this fork.
# Direct-pushes to main on success, per maintainer preference.
# Whitelisted auto-resolution lives in scripts/sync_upstream.sh.
# Any non-whitelisted conflict aborts the merge and job fails for manual triage.

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.95.0

      - name: Sync upstream
        run: |
          chmod +x scripts/sync_upstream.sh
          bash scripts/sync_upstream.sh

      - name: Validate after merge
        run: |
          echo "=== Config checks ==="
          bash ./scripts/check_release_config.sh
          bash ./scripts/check_config_release_readiness.sh
          echo ""
          echo "=== Cargo check (locked) ==="
          cargo check --locked -p kaku -p kaku-gui

      - name: Push to main if updated
        run: |
          # Only push if HEAD is ahead of origin/main
          git fetch origin main
          if git rev-list --left-right --count origin/main...HEAD | grep -q "^0[[:space:]]"; then
            echo "No new commits to push"
            exit 0
          fi
          echo "Pushing $(git rev-parse --short HEAD) to origin/main"
          git push origin HEAD:main

      - name: Auto-tag to follow upstream release
        if: success()
        run: |
          echo "Checking for upstream tags to mirror..."
          git fetch upstream --tags --prune
          # Get latest upstream semver tag (v/V)
          latest_upstream_tag=$(git ls-remote --tags upstream | grep -E 'refs/tags/[Vv][0-9]+\.[0-9]+\.[0-9]+(\^\{\})?$' | sed -E 's|.*refs/tags/||; s|\^\{\}||' | grep -E '^[Vv][0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest_upstream_tag" ]; then
            echo "No upstream tags found"
            exit 0
          fi
          echo "Latest upstream tag: $latest_upstream_tag"
          # Skip if tag already exists locally or on origin
          if git rev-parse -q --verify "refs/tags/$latest_upstream_tag" >/dev/null; then
            echo "Tag $latest_upstream_tag already exists locally"
            exit 0
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/$latest_upstream_tag$"; then
            echo "Tag $latest_upstream_tag already exists on origin"
            exit 0
          fi
          # Only auto-tag when Cargo.toml version matches the tag (ensures code is ready)
          cargo_ver=$(grep '^version =' kaku/Cargo.toml | head -n1 | cut -d'"' -f2)
          clean_tag=${latest_upstream_tag#[vV]}
          if [ "$cargo_ver" != "$clean_tag" ]; then
            echo "Cargo version $cargo_ver != upstream tag $clean_tag, skipping auto-tag"
            echo "Will auto-tag when Cargo.toml catches up after merge"
            exit 0
          fi
          echo "Creating tag $latest_upstream_tag at HEAD $(git rev-parse --short HEAD)"
          git tag -a "$latest_upstream_tag" -m "$latest_upstream_tag synced from upstream"
          git push origin tag "$latest_upstream_tag"
          echo "Auto-tag $latest_upstream_tag pushed — release workflow will be triggered"
